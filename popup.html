<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      padding: 32px 28px 24px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }

    .status-card {
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px 20px;
      margin-bottom: 28px;
      transition: border-color 0.3s ease, background 0.3s ease;
      background: transparent;
    }

    .status-card.recording {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.03);
    }

    .status-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .recording-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text {
      font-size: 13px;
      font-weight: 400;
      color: #888;
      letter-spacing: 0.02em;
    }

    .status-card.recording .status-text {
      color: #fff;
    }

    .wave-animation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-top: 16px;
    }

    .wave {
      width: 2px;
      height: 16px;
      background: #fff;
      border-radius: 1px;
      animation: wave 1.2s ease-in-out infinite;
    }

    .wave:nth-child(2) { animation-delay: 0.1s; }
    .wave:nth-child(3) { animation-delay: 0.2s; }
    .wave:nth-child(4) { animation-delay: 0.3s; }
    .wave:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.3); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .transcript-preview {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #222;
      font-size: 13px;
      line-height: 1.6;
      color: #aaa;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
    }

    .transcript-preview::-webkit-scrollbar { width: 3px; }
    .transcript-preview::-webkit-scrollbar-track { background: transparent; }
    .transcript-preview::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .btn:hover:not(:disabled) {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn-primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #ddd;
      border-color: #ddd;
    }

    .btn-danger {
      border-color: #333;
      color: #fff;
      background: transparent;
    }

    .btn-danger:hover:not(:disabled) {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .btn-action {
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 8px;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .btn-action:hover:not(:disabled) {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn-action:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .footer {
      margin-top: auto;
      text-align: center;
      padding-top: 20px;
    }

    .footer-text {
      font-size: 11px;
      color: #444;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .hidden {
      display: none !important;
    }

    .fade-in {
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Audio Transcriber</div>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-content">
        <span id="status-indicator" class="recording-indicator hidden"></span>
        <span id="status-text" class="status-text">Ready to transcribe</span>
      </div>
      <div id="wave-animation" class="wave-animation hidden">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
      <div id="transcript-preview" class="transcript-preview hidden"></div>
    </div>

    <div class="controls">
      <button id="playBtn" class="btn btn-primary">
        <span class="btn-text">Record</span>
      </button>
      <button id="stopBtn" class="btn btn-danger" disabled>
        <span class="btn-text">Stop</span>
      </button>
    </div>

    <button id="downloadBtn" class="btn-action hidden">
      <span class="btn-text">Download Transcript</span>
    </button>

    <button id="refreshBtn" class="btn-action hidden">
      <span class="btn-text">Clear</span>
    </button>

    <div class="footer">
      <div class="footer-text">
        All processing happens locally.<br>
        No data leaves your device.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
